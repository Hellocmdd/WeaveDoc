name: RAG Eval (Optional)

on:
  workflow_dispatch:
    inputs:
      baseline_path:
        description: Baseline file path. Leave empty to skip.
        required: false
        default: ''
      report_dir:
        description: Report output directory
        required: false
        default: .eval/github-actions
      llama_server_base_url:
        description: Llama server base URL
        required: false
        default: http://127.0.0.1:8080
      start_llama_server:
        description: Start local llama-server if not reachable
        required: false
        type: boolean
        default: false
      chat_model_path:
        description: Local chat model path used when starting llama-server
        required: false
        default: models/Qwen3.5-4B-Q4_K_M.gguf
      allow_skip:
        description: Succeed with skip when prerequisites are missing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_VERSION: 10.0.x

jobs:
  eval:
    name: Optional RAG Eval
    runs-on: ubuntu-latest
    env:
      BASELINE_PATH: ${{ inputs.baseline_path }}
      REPORT_DIR: ${{ inputs.report_dir || '.eval/github-actions' }}
      LLAMA_SERVER_BASE_URL: ${{ inputs.llama_server_base_url || 'http://127.0.0.1:8080' }}
      START_LLAMA_SERVER: ${{ inputs.start_llama_server }}
      CHAT_MODEL_PATH: ${{ inputs.chat_model_path || 'models/Qwen3.5-4B-Q4_K_M.gguf' }}
      ALLOW_SKIP: ${{ inputs.allow_skip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          submodules: false

      - name: Preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          baseline_path="${BASELINE_PATH:-}"
          allow_skip="${ALLOW_SKIP:-true}"
          start_llama_server="${START_LLAMA_SERVER:-false}"
          should_run=true
          skip_reason=""

          skip_or_fail() {
            should_run=false
            skip_reason="$1"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"

            if [[ "$allow_skip" == "true" ]]; then
              echo "Optional eval skipped: $skip_reason"
              exit 0
            fi

            echo "Optional eval blocked: $skip_reason" >&2
            exit 1
          }

          if [[ -z "$baseline_path" ]]; then
            skip_or_fail "No baseline_path input was provided."
          fi

          if [[ ! -f "$baseline_path" ]]; then
            skip_or_fail "Baseline file not found: $baseline_path"
          fi

          url_no_scheme="${LLAMA_SERVER_BASE_URL#http://}"
          url_no_scheme="${url_no_scheme#https://}"
          host_port="${url_no_scheme%%/*}"
          server_host="${host_port%%:*}"
          server_port="${host_port##*:}"

          if [[ "$host_port" == "$server_host" ]]; then
            server_port="8080"
          fi

          server_ok=false
          if curl -fsS "$LLAMA_SERVER_BASE_URL/health" >/dev/null 2>&1; then
            server_ok=true
          fi

          if [[ "$server_ok" != "true" && "$start_llama_server" == "true" ]]; then
            if [[ -x "./llama.cpp/build/bin/llama-server" && -f "$CHAT_MODEL_PATH" ]]; then
              echo "Starting local llama-server with model: $CHAT_MODEL_PATH"
              mkdir -p ./.eval
              ./llama.cpp/build/bin/llama-server \
                -m "$CHAT_MODEL_PATH" \
                --host "$server_host" \
                --port "$server_port" \
                > ./.eval/llama-server-gha.log 2>&1 &

              for i in {1..30}; do
                if curl -fsS "$LLAMA_SERVER_BASE_URL/health" >/dev/null 2>&1; then
                  server_ok=true
                  break
                fi
                sleep 1
              done
            else
              skip_or_fail "llama-server unavailable and local startup prerequisites missing (binary/model)."
            fi
          fi

          if [[ "$server_ok" != "true" && "$should_run" == "true" ]]; then
            skip_or_fail "llama-server health check failed and local startup disabled."
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.slnx
            **/packages.lock.json
            tools/DownloadExternalTools.targets

      - name: Run eval
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          ./scripts/eval_rag.sh "$BASELINE_PATH" "$REPORT_DIR"

      - name: Upload eval report
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: ${{ env.REPORT_DIR }}

      - name: Summary (Skipped)
        if: steps.preflight.outputs.should_run != 'true'
        shell: bash
        run: |
          {
            echo "## Optional Eval"
            echo "Status: Skipped"
            echo "Reason: ${{ steps.preflight.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (Executed)
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          {
            echo "## Optional Eval"
            echo "Status: Executed"
            echo "Baseline: $BASELINE_PATH"
            echo "Report directory: $REPORT_DIR"
          } >> "$GITHUB_STEP_SUMMARY"
