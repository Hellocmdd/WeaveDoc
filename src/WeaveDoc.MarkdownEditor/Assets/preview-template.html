<!DOCTYPE html>
<html data-weavedoc-theme="auto">
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <!-- CSP removed: file:// origin under WebKitGTK may block inline scripts even with 'unsafe-inline' -->
    <link rel="stylesheet" href="katex/katex.min.css">
    <script src="katex/katex.min.js"></script>
    <script src="katex/contrib/mhchem.min.js"></script>
    <style>
        :root {
            --text-color: #333;
            --bg-color: #ffffff;
            --heading-color: #24292e;
            --border-color: #eaecef;
            --link-color: #4285f4;
            --code-bg-color: #f6f8fa;
            --code-color: #e63946;
            --blockquote-color: #6a737d;
            --blockquote-border-color: #dfe2e5;
            --table-border-color: #dfe2e5;
            --table-header-bg: #f6f8fa;
            --table-alt-bg: #fafbfc;
            --highlight-color: rgba(255, 193, 7, 0.4);
            --hover-color: rgba(66, 133, 244, 0.1);
            --font-size: 16px;
            --line-height: 1.8;
            color-scheme: light;
        }

        :root[data-weavedoc-theme="dark"] {
            --text-color: #d4d4d4;
            --bg-color: #1e1e1e;
            --heading-color: #f0f0f0;
            --border-color: #3a3a3a;
            --link-color: #58a6ff;
            --code-bg-color: #2d2d2d;
            --code-color: #ff7b72;
            --blockquote-color: #b7bec8;
            --blockquote-border-color: #444c56;
            --table-border-color: #444c56;
            --table-header-bg: #2d2d2d;
            --table-alt-bg: #252525;
            --highlight-color: rgba(255, 193, 7, 0.34);
            --hover-color: rgba(88, 166, 255, 0.16);
            color-scheme: dark;
        }

        :root[data-weavedoc-theme="auto"] {
            color-scheme: light dark;
        }

        /* Explicit light rule (mirrors the :root defaults). Keeps the selector
           symmetric with "dark" so flipping data-weavedoc-theme to "light" has a
           concrete match instead of relying solely on the unqualified :root. */
        :root[data-weavedoc-theme="light"] {
            --text-color: #333;
            --bg-color: #ffffff;
            --heading-color: #24292e;
            --border-color: #eaecef;
            --link-color: #4285f4;
            --code-bg-color: #f6f8fa;
            --code-color: #e63946;
            --blockquote-color: #6a737d;
            --blockquote-border-color: #dfe2e5;
            --table-border-color: #dfe2e5;
            --table-header-bg: #f6f8fa;
            --table-alt-bg: #fafbfc;
            --highlight-color: rgba(255, 193, 7, 0.4);
            --hover-color: rgba(66, 133, 244, 0.1);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root[data-weavedoc-theme="auto"] {
                --text-color: #d4d4d4;
                --bg-color: #1e1e1e;
                --heading-color: #f0f0f0;
                --border-color: #3a3a3a;
                --link-color: #58a6ff;
                --code-bg-color: #2d2d2d;
                --code-color: #ff7b72;
                --blockquote-color: #b7bec8;
                --blockquote-border-color: #444c56;
                --table-border-color: #444c56;
                --table-header-bg: #2d2d2d;
                --table-alt-bg: #252525;
                --highlight-color: rgba(255, 193, 7, 0.34);
                --hover-color: rgba(88, 166, 255, 0.16);
            }
        }
        
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* Both html AND body carry the theme background. Without this, html is
               transparent and WebView2's default white controller background shows
               through any region body doesn't cover, so the page looks "stuck" on
               white when the theme flips. */
            background-color: var(--bg-color);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; 
            font-size: var(--font-size); 
            line-height: var(--line-height); 
            color: var(--text-color); 
            background-color: var(--bg-color); 
            padding: 24px 32px; 
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        
        h1, h2, h3, h4, h5, h6 { 
            font-weight: 600; 
            margin-top: 1.5em; 
            margin-bottom: 0.75em; 
            line-height: 1.4; 
            color: var(--heading-color);
        }
        h1 { 
            font-size: 2em; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 0.3em; 
            margin-top: 0;
        }
        h2 { 
            font-size: 1.5em; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 0.3em; 
        }
        h3 { font-size: 1.25em; }
        h4 { font-size: 1em; }
        h5 { font-size: 0.875em; }
        h6 { font-size: 0.85em; color: var(--blockquote-color); }
        
        p { 
            margin-top: 0; 
            margin-bottom: 1em; 
            text-align: justify;
        }
        
        ul, ol { 
            padding-left: 2em; 
            margin-top: 0; 
            margin-bottom: 1em; 
        }
        li { 
            margin-top: 0.25em; 
        }
        li > ul, li > ol {
            margin-top: 0.25em;
        }
        
        code { 
            font-family: 'Fira Code', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace; 
            font-size: 0.85em; 
            padding: 0.2em 0.4em; 
            background-color: var(--code-bg-color); 
            border-radius: 3px; 
            color: var(--code-color);
            word-break: break-all;
        }
        
        pre { 
            padding: 16px; 
            overflow: auto; 
            font-size: 0.85em; 
            line-height: 1.6; 
            background-color: var(--code-bg-color); 
            border-radius: 6px; 
            margin-bottom: 1em; 
            border: 1px solid var(--border-color);
        }
        pre code { 
            padding: 0; 
            background-color: transparent; 
            border-radius: 0; 
            color: inherit;
            word-break: normal;
        }
        
        blockquote { 
            margin: 0 0 1em 0; 
            padding: 0 1em; 
            color: var(--blockquote-color); 
            border-left: 0.25em solid var(--blockquote-border-color); 
            background-color: transparent;
        }
        blockquote > :first-child {
            margin-top: 0;
        }
        blockquote > :last-child {
            margin-bottom: 0;
        }
        
        a { 
            color: var(--link-color); 
            text-decoration: none; 
            background-color: transparent;
        }
        a:hover { 
            text-decoration: underline; 
        }
        a:active {
            color: #1a73e8;
        }
        
        hr { 
            height: 0; 
            padding: 0; 
            margin: 24px 0; 
            background-color: transparent; 
            border: 0;
            border-top: 1px solid var(--border-color);
        }
        
        table { 
            border-spacing: 0; 
            border-collapse: collapse; 
            margin-bottom: 1em; 
            width: 100%; 
            font-size: 0.9em;
        }
        table th, table td { 
            padding: 6px 13px; 
            border: 1px solid var(--table-border-color); 
        }
        table th { 
            font-weight: 600; 
            background-color: var(--table-header-bg); 
            text-align: left;
        }
        table tr:nth-child(2n) { 
            background-color: var(--table-alt-bg); 
        }
        table tr:hover {
            background-color: var(--table-header-bg);
        }
        
        img { 
            max-width: 100%; 
            box-sizing: content-box;
            border-style: none;
        }
        
        #content { 
            min-height: 100%; 
            max-width: 900px;
            margin: 0 auto;
        }
        
        [data-line] { 
            cursor: pointer; 
        }
        [data-line]:hover { 
            background-color: var(--hover-color); 
        }
        
        [data-pos] {
            cursor: pointer;
            border-bottom: 1px dashed transparent;
        }
        [data-pos]:hover {
            background-color: rgba(255, 193, 7, 0.3);
            border-bottom: 1px dashed #ffc107;
        }

        .highlight-char {
            background-color: rgba(255, 193, 7, 0.5) !important;
            border-radius: 2px;
        }
        
        kbd {
            display: inline-block;
            padding: 3px 5px;
            font-size: 0.75em;
            line-height: 1;
            color: #444d58;
            background-color: #fafbfc;
            border: 1px solid #d1d5da;
            border-radius: 3px;
            box-shadow: inset 0 -1px 0 #d1d5da;
            font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
        }
        
        mark {
            background-color: #fff3cd;
            color: inherit;
            padding: 0.2em;
        }
        
        del {
            text-decoration: line-through;
            color: #6a737d;
        }
        
        strong {
            font-weight: 600;
        }
        
        em {
            font-style: italic;
        }

        /* KaTeX 样式 */
        .math-inline {
            /* 行内公式样式 */
        }

        .math-display {
            /* 块级公式样式 */
            margin: 1em 0;
            text-align: center;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .math-display .katex {
            /* 块级公式字体大小 */
            font-size: 1.1em;
        }

        .katex-error {
            /* KaTeX 错误提示 */
            color: #e63946;
            font-family: 'Fira Code', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
            font-size: 0.85em;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #D4D4D4;
                --bg-color: #1E1E1E;
                --link-color: #6CB6FF;
                --code-bg-color: #2D2D2D;
                --code-color: #F44747;
                --blockquote-color: #8B949E;
                --blockquote-border-color: #3C3C3C;
                --table-border-color: #3C3C3C;
                --table-header-bg: #2D2D2D;
                --highlight-color: rgba(255, 193, 7, 0.3);
                --hover-color: rgba(108, 182, 255, 0.1);
            }
            body {
                color: #D4D4D4;
                background-color: #1E1E1E;
            }
            h1, h2, h3, h4, h5, h6 { color: #E8E8E8; }
            h1 { border-bottom-color: #3C3C3C; }
            h2 { border-bottom-color: #303030; }
            h6 { color: #8B949E; }
            code {
                background-color: rgba(255, 255, 255, 0.08);
                color: #F44747;
            }
            pre {
                background-color: #1A1A1A;
                border-color: #3C3C3C;
            }
            blockquote {
                color: #8B949E;
                border-left-color: #3C3C3C;
            }
            a { color: #6CB6FF; }
            a:hover { color: #8FC8FF; }
            a:active { color: #4DA0FF; }
            hr { border-top-color: #3C3C3C; }
            table th, table td { border-color: #3C3C3C; }
            table th { background-color: #2D2D2D; }
            table tr:nth-child(2n) { background-color: #252525; }
            table tr:hover { background-color: #2D2D2D; }
            kbd {
                color: #8B949E;
                background-color: #1A1A1A;
                border-color: #3C3C3C;
            }
            mark { background-color: #5D4A00; }
            del { color: #8B949E; }
        }
    </style>
</head>
<body>
    <div id='content'>Welcome to WeaveDoc Preview</div>
    <script>
        (function() {
            if (window.weaveDocBridge) {
                return;
            }

            var listeners = [];
            function normalize(message) {
                if (typeof message === 'string') {
                    try {
                        return JSON.parse(message);
                    } catch (err) {
                        return { Type: 'raw', Data: message };
                    }
                }
                return message || {};
            }

            window.weaveDocBridge = {
                post: function(message) {
                    var normalized = normalize(message);
                    try {
                        if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
                            window.chrome.webview.postMessage(normalized);
                            return;
                        }
                        if (window.external && typeof window.external.invoke === 'function') {
                            window.external.invoke(JSON.stringify(normalized));
                            return;
                        }
                        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.webview) {
                            window.webkit.messageHandlers.webview.postMessage(normalized);
                        }
                    } catch (err) {
                        console.error('weaveDocBridge post failed', err);
                    }
                },
                onHostMessage: function(listener) {
                    if (typeof listener === 'function') {
                        listeners.push(listener);
                    }
                },
                receiveFromHost: function(message) {
                    var normalized = normalize(message);
                    var snapshot = listeners.slice();
                    for (var i = 0; i < snapshot.length; i++) {
                        snapshot[i](normalized);
                    }
                }
            };

            if (window.chrome && window.chrome.webview && typeof window.chrome.webview.addEventListener === 'function') {
                window.chrome.webview.addEventListener('message', function(e) {
                    window.weaveDocBridge.receiveFromHost(e.data);
                });
            }

            window.addEventListener('message', function(e) {
                window.weaveDocBridge.receiveFromHost(e.data);
            });
        })();

        // 检查 KaTeX 是否加载成功
        var katexLoaded = typeof katex !== 'undefined';
        console.log('KaTeX loaded:', katexLoaded);
        sendMessage({ Type: 'debug', Data: 'KaTeX loaded: ' + katexLoaded });
        if (katexLoaded) {
            console.log('KaTeX version:', katex.version);
            sendMessage({ Type: 'debug', Data: 'KaTeX version: ' + katex.version });
        } else {
            console.error('KaTeX not loaded!');
            sendMessage({ Type: 'debug', Data: 'ERROR: KaTeX not loaded!' });
        }

        // KaTeX 配置选项 - 兼容更多 LaTeX 语法
        var katexOptions = {
            throwOnError: false,
            displayMode: false,
            strict: false,
            trust: true,
            macros: {
                // 常见的宏定义
                "\\RR": "\\mathbb{R}",
                "\\NN": "\\mathbb{N}",
                "\\ZZ": "\\mathbb{Z}",
                "\\QQ": "\\mathbb{Q}",
                "\\CC": "\\mathbb{C}",
                "\\ii": "\\imaginaryI",
                "\\jj": "\\imaginaryJ",
                "\\deg": "^\\circ"
            }
        };

        function forEachNode(nodes, callback) {
            for (var i = 0; i < nodes.length; i++) {
                callback(nodes[i], i);
            }
        }

        function mergeOptions(base, extra) {
            var merged = {};
            var key;
            for (key in base) {
                if (Object.prototype.hasOwnProperty.call(base, key)) {
                    merged[key] = base[key];
                }
            }
            for (key in extra) {
                if (Object.prototype.hasOwnProperty.call(extra, key)) {
                    merged[key] = extra[key];
                }
            }
            return merged;
        }

        function matchesSelector(element, selector) {
            if (!element || element.nodeType !== Node.ELEMENT_NODE) {
                return false;
            }

            var matcher = element.matches || element.webkitMatchesSelector || element.msMatchesSelector;
            return matcher ? matcher.call(element, selector) : false;
        }

        function closestElement(element, selector) {
            var current = element;
            while (current && current.nodeType === Node.ELEMENT_NODE) {
                if (matchesSelector(current, selector)) {
                    return current;
                }

                current = current.parentElement;
            }

            return null;
        }

        function renderMath() {
            console.log('renderMath called');
            sendMessage({ Type: 'debug', Data: 'renderMath called' });
            try {
                // 渲染行内公式
                var inlineMathElements = document.querySelectorAll('.math-inline');
                console.log('Found inline math elements:', inlineMathElements.length);
                sendMessage({ Type: 'debug', Data: 'Found inline math elements: ' + inlineMathElements.length });
                forEachNode(inlineMathElements, function(el) {
                    try {
                        var mathContent = el.textContent;
                        console.log('Rendering inline math:', mathContent);
                        var options = mergeOptions(katexOptions, { displayMode: false });
                        var html = katex.renderToString(mathContent, options);
                        el.innerHTML = html;
                        console.log('Inline math rendered successfully');
                    } catch (e) {
                        console.error('KaTeX inline error:', e);
                        sendMessage({ Type: 'debug', Data: 'KaTeX inline error: ' + e.message + ' | Content: ' + el.textContent });
                        // 如果渲染失败，保留原始内容但不显示错误
                        el.classList.add('katex-error');
                        el.textContent = el.textContent;
                    }
                });

                // 渲染块级公式
                var displayMathElements = document.querySelectorAll('.math-display');
                console.log('Found display math elements:', displayMathElements.length);
                sendMessage({ Type: 'debug', Data: 'Found display math elements: ' + displayMathElements.length });
                forEachNode(displayMathElements, function(el) {
                    try {
                        var mathContent = el.textContent;
                        console.log('Rendering display math:', mathContent);
                        sendMessage({ Type: 'debug', Data: 'Rendering display math: ' + mathContent });
                        var options = mergeOptions(katexOptions, { displayMode: true });
                        var html = katex.renderToString(mathContent, options);
                        el.innerHTML = html;
                        console.log('Display math rendered successfully');
                    } catch (e) {
                        console.error('KaTeX display error:', e);
                        sendMessage({ Type: 'debug', Data: 'KaTeX display error: ' + e.message + ' | Content: ' + el.textContent });
                        // 如果渲染失败，保留原始内容但不显示错误
                        el.classList.add('katex-error');
                        el.textContent = el.textContent;
                    }
                });
            } catch (e) {
                console.error('KaTeX render error:', e);
                sendMessage({ Type: 'debug', Data: 'KaTeX render error: ' + e.message });
            }
        }

        function sendMessage(msg) {
            window.weaveDocBridge.post(msg);
        }

        function testSendClick() {
            console.log('testSendClick called');
            sendMessage({ Type: 'debug', Data: 'Test button clicked' });
            sendMessage({ Type: 'previewClick', Data: JSON.stringify({ line: 5, column: 5 }) });
        }

        window.updateContent = function(html) {
            try {
                var contentDiv = document.getElementById('content');
                if (contentDiv) {
                    var currentScrollY = window.scrollY || document.documentElement.scrollTop;
                    var currentScrollX = window.scrollX || document.documentElement.scrollLeft;
                    
                    contentDiv.innerHTML = html;

                    var posElements = contentDiv.querySelectorAll('[data-pos]');
                    sendMessage({ Type: 'debug', Data: 'Found ' + posElements.length + ' data-pos elements' });

                    // 添加点击事件到每个 data-pos 元素
                    forEachNode(posElements, function(el) {
                        el.addEventListener('click', function(e) {
                            var pos = el.getAttribute('data-pos');
                            console.log('data-pos element clicked:', pos);
                            sendMessage({ Type: 'debug', Data: 'Direct click on data-pos: ' + pos });
                        });
                    });

                    // 渲染 LaTeX 数学公式
                    renderMath();
                    
                    window.scrollTo(currentScrollX, currentScrollY);
                }
            } catch (err) {
                sendMessage({ Type: 'debug', Data: 'ERROR IN updateContent: ' + err.message + ' STACK: ' + err.stack });
                throw err;
            }
        };

        // 跟踪是否有活跃的选区
        var hasActiveSelection = false;

        // 在 data-pos span 内根据 Range 偏移计算精确的行-列位置
        function computePosFromRange(posElement, container, offset) {
            var basePos = posElement.getAttribute('data-pos');
            if (!basePos) return null;

            var parts = basePos.split('-');
            var baseLine = parseInt(parts[0], 10);
            var baseCol = parseInt(parts[1], 10);

            // 用 Range 测量从 span 开头到选中点的字符数
            try {
                var r = document.createRange();
                r.setStart(posElement, 0);
                r.setEnd(container, offset);
                var charOffset = r.toString().length;
                return baseLine + '-' + (baseCol + charOffset);
            } catch (e) {
                return basePos;
            }
        }

        // 向上查找最近的 data-pos 元素
        function findDataPosAncestor(node) {
            var el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
            var depth = 0;
            while (el && !el.hasAttribute('data-pos')) {
                el = el.parentElement;
                if (++depth > 50) return null;
            }
            return el;
        }

        // 获取选区的位置信息
        function getSelectionPositions() {
            var selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) {
                return null;
            }

            var range = selection.getRangeAt(0);
            var selectedText = selection.toString();

            if (!selectedText || selectedText.trim() === '') {
                return null;
            }

            var startPosElement = findDataPosAncestor(range.startContainer);
            var endPosElement = findDataPosAncestor(range.endContainer);

            if (!startPosElement || !endPosElement) {
                return null;
            }

            var startPos = computePosFromRange(startPosElement, range.startContainer, range.startOffset);
            var endPos = computePosFromRange(endPosElement, range.endContainer, range.endOffset);

            if (!startPos || !endPos) {
                return null;
            }

            return {
                start: startPos,
                end: endPos,
                length: selectedText.length
            };
        }

        // 文本选择事件监听器
        document.addEventListener('mouseup', function(e) {
            console.log('[DEBUG-SEL] mouseup fired');
            var selection = getSelectionPositions();
            console.log('[DEBUG-SEL] getSelectionPositions returned:', JSON.stringify(selection));
            if (selection && selection.start) {
                console.log('Selection detected:', selection);
                sendMessage({ Type: 'debug', Data: 'Selection: ' + JSON.stringify(selection) });

                // 标记有活跃的选区
                hasActiveSelection = true;

                var startParts = selection.start.split('-');
                var endParts = selection.end ? selection.end.split('-') : startParts;

                var data = {
                    startLine: parseInt(startParts[0], 10) || 1,
                    startColumn: parseInt(startParts[1], 10) || 1,
                    endLine: parseInt(endParts[0], 10) || 1,
                    endColumn: parseInt(endParts[1], 10) || 1,
                    length: selection.length || 1
                };

                sendMessage({ Type: 'previewSelection', Data: JSON.stringify(data) });
            } else {
                // 如果没有选区，重置状态
                hasActiveSelection = false;
                // 发送清除高亮的消息
                sendMessage({ Type: 'previewClearHighlight', Data: '' });
            }
        });

        // 全局点击事件监听器
        document.addEventListener('click', function(e) {
            console.log('[DEBUG-SEL] click event triggered, hasActiveSelection:', hasActiveSelection);
            sendMessage({ Type: 'debug', Data: 'Document click triggered' });

            // 如果有活跃的选区，检查是否点击在选区外部
            var currentSelection = window.getSelection();
            var hasSelection = currentSelection && currentSelection.toString().trim() !== '';

            if (hasActiveSelection && hasSelection) {
                console.log('Ignoring click because there is an active selection');
                return;
            }

            var target = e.target;

            // 拦截外链点击，阻止 WebView 导航离开预览页面
            var linkElement = closestElement(target, 'a[href]');
            if (linkElement) {
                var href = linkElement.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
                    e.preventDefault();
                    sendMessage({ Type: 'linkClicked', Data: JSON.stringify({ url: href }) });
                    return;
                }
            }

            console.log('Click target:', target.tagName, target.className, target.id);
            
            // 检查是否点击了 data-pos 元素
            var posElement = closestElement(target, '[data-pos]');
            if (posElement) {
                var posAttr = posElement.getAttribute('data-pos');
                console.log('Found data-pos element:', posAttr);
                sendMessage({ Type: 'debug', Data: 'Found data-pos: ' + posAttr });
                
                if (posAttr) {
                    var parts = posAttr.split('-');
                    var lineNumber = parseInt(parts[0], 10) || 1;
                    var colNumber = parseInt(parts[1], 10) || 1;
                    sendMessage({ Type: 'debug', Data: 'Sending previewClick: line=' + lineNumber + ', column=' + colNumber });
                    sendMessage({ Type: 'previewClick', Data: JSON.stringify({ line: lineNumber, column: colNumber }) });
                    return;
                }
            }
            
            // 检查是否点击了 data-line 元素
            var lineElement = closestElement(target, '[data-line]');
            if (lineElement) {
                var lineNumber = parseInt(lineElement.getAttribute('data-line'), 10) || 1;
                console.log('Found data-line element:', lineNumber);
                sendMessage({ Type: 'debug', Data: 'Found data-line: ' + lineNumber });
                sendMessage({ Type: 'previewClick', Data: JSON.stringify({ line: lineNumber, column: 1 }) });
                return;
            }
            
            sendMessage({ Type: 'debug', Data: 'No data-pos or data-line found in click path' });
        }, true);

        function clearHighlight() {
            var highlighted = document.querySelectorAll('.highlight-char');
            forEachNode(highlighted, function(el) {
                el.classList.remove('highlight-char');
            });
        }

        window.scrollToLine = function(lineNumber) {
            try {
                clearHighlight();
                var allElements = document.querySelectorAll('[data-pos]');
                for (var i = 0; i < allElements.length; i++) {
                    var el = allElements[i];
                    var posAttr = el.getAttribute('data-pos');
                    if (posAttr) {
                        var parts = posAttr.split('-');
                        var elLine = parseInt(parts[0], 10);
                        if (elLine === lineNumber) {
                            el.classList.add('highlight-char');
                        }
                    }
                }
                var firstChar = document.querySelector('.highlight-char');
                if (firstChar) { firstChar.scrollIntoView(); }
            } catch (err) { }
        };

        window.scrollToSelection = function(startLine, startCol, endLine, endCol) {
            try {
                clearHighlight();
                var allElements = document.querySelectorAll('[data-pos]');
                for (var i = 0; i < allElements.length; i++) {
                    var el = allElements[i];
                    var posAttr = el.getAttribute('data-pos');
                    if (posAttr) {
                        var parts = posAttr.split('-');
                        var elLine = parseInt(parts[0], 10);
                        var elCol = parseInt(parts[1], 10);
                        var elLen = (el.textContent || '').length;
                        var elEndCol = elCol + elLen;

                        // Check if this text-run span overlaps with the selection range
                        var overlaps = false;
                        if (startLine === endLine && elLine === startLine) {
                            overlaps = elCol < endCol && elEndCol > startCol;
                        } else if (elLine === startLine) {
                            overlaps = elEndCol > startCol;
                        } else if (elLine === endLine) {
                            overlaps = elCol < endCol;
                        } else if (elLine > startLine && elLine < endLine) {
                            overlaps = true;
                        }
                        if (overlaps) {
                            el.classList.add('highlight-char');
                        }
                    }
                }
                var firstChar = document.querySelector('.highlight-char');
                if (firstChar) { firstChar.scrollIntoView(); }
            } catch (err) { }
        };

        window.addEventListener('load', function() {
            sendMessage({ Type: 'previewLoaded', Data: 'loaded' });
        });

        window.addEventListener('resize', function() {
            document.body.style.width = '100%';
            document.body.style.height = '100%';
        });
    </script>
</body>
</html>
